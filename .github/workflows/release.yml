name: Topic Branch CI / Main CD

on:
  push:
    branches:
      - main # main 브랜치에 코드가 푸시(머지 포함)될 때 실행
      # 공개 저장소의 fork PR 코드를 내부 VM에서 실행하지 않는다. PR에 쓰는 저장소 내부
      # 토픽 브랜치만 검사하고, 이 결과를 main ruleset의 required check로 묶는다.
      - 'release/**'
      - 'fix/**'
      - 'chore/**'

concurrency:
  group: production-deploy-${{ github.ref }}
  # 이미지 push나 TrueNAS app.update 중간에 취소되면 반쪽 배포가 될 수 있다.
  cancel-in-progress: false

env:
  # 레지스트리의 mutable latest가 바뀌어도 검토한 공용 베이스만 사용한다.
  BASE_IMAGE_DIGEST: sha256:3f79b44d4a8e81b9a533cd6d528d095eca0bdadf594514c360c2a73563d7af85
  # 공개 저장소라 주소·계정은 파일에 쓰지 않고 저장소 변수로 받는다
  # (Settings → Secrets and variables → Actions → Variables). 비어 있으면 첫 단계에서 멈춘다.
  # 러너(VM) → NAS. 여기로 SSH 하면 authorized_keys 의 `command=` 가 재시작 스크립트를
  # 강제 실행한다 — 무슨 명령을 보내든 그것만 돈다.
  DEPLOY_SSH_TARGET: ${{ vars.DEPLOY_SSH_TARGET }}
  # 배포가 끝나고 실제로 열어 볼 주소. `/` 는 `/blog` 로 302 하므로 -L 로 따라간다.
  HEALTH_URL: ${{ vars.HEALTH_URL }}

jobs:
  # 0단계: 기본 검증 (CI)
  quality-check:
    name: quality-check
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    steps:
      # PR 이미지 빌드와 main 배포가 같은 사설 레지스트리를 쓴다.
      - name: Check deploy variables
        run: |
          if [ -z "$DEPLOY_SSH_TARGET" ] || [ -z "$HEALTH_URL" ]; then
            echo "::error::저장소 변수 DEPLOY_SSH_TARGET·HEALTH_URL 이 비어 있다 (Settings → Secrets and variables → Actions → Variables)"
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # CI 계산도 UbuntuVM 안에서 끝낸다. GitHub 호스팅 Runner와 캐시는 쓰지 않는다.
      - name: Prepare Python environment
        run: |
          python3 -m venv .venv-ci
          echo "$GITHUB_WORKSPACE/.venv-ci/bin" >> "$GITHUB_PATH"

      # ⚠️ `requirements-api.txt` 에는 **공용 이미지에 없는 것만** 적혀 있다(지금은 nh3 하나).
      #    런타임 의존성은 `fastapi-py312` 이미지가 들고 있는데 CI 러너에는 그 이미지가
      #    없다. 그래서 아래 검사에 필요한 것을 여기서 따로 깐다 — 안 그러면
      #    템플릿 검사가 `ModuleNotFoundError: jinja2` 로 죽는다(2026-08-17 실제로 그랬다.
      #    이 검사는 PHP 시절 이후 main 푸시가 없어 한 번도 돌아본 적이 없었다).
      - name: Install dependencies for CI
        run: |
          pip install --no-cache-dir -r requirements-api.txt
          # ⚠️ 러너에는 공용 이미지(fastapi-py312)가 없다. 앱을 임포트하려면 런타임
          #    의존성을 여기서 다시 깔아야 한다 — 목록과 이유는 requirements-ci.txt 참조.
          pip install --no-cache-dir -r requirements-ci.txt

      # PHP 스택을 걷어냈다. 옛 `php -l` 자리 — 컴파일만 확인한다(실행하지 않는다).
      - name: Python 문법 검사
        run: python -m compileall -q app

      # 템플릿은 문법이 깨져도 임포트로는 안 드러난다. 실제로 관리자 화면 전부가
      # 500 이 된 적이 있어(리스트 리터럴 안의 Jinja 주석) 컴파일을 따로 확인한다.
      - name: Jinja 템플릿 검사
        run: |
          python - <<'PY'
          from jinja2 import Environment, FileSystemLoader
          from pathlib import Path
          env = Environment(loader=FileSystemLoader("app/templates"))
          bad = []
          for p in sorted(Path("app/templates").rglob("*.html")):
              name = str(p.relative_to("app/templates"))
              try:
                  env.get_template(name)
              except Exception as e:
                  bad.append(f"{name}: {type(e).__name__} {e}")
          print("\n".join(bad) if bad else "템플릿 OK")
          raise SystemExit(1 if bad else 0)
          PY

      - name: Deployment file 검사
        run: |
          bash -n deploy/nas/deploy-blog-image.sh
          python - <<'PY' | docker compose -f - config -q
          from pathlib import Path
          text = Path("deploy/truenas/bae-blog.yml").read_text()
          text = text.replace("__VERSION__", "v0.0.0")
          text = text.replace("__DIGEST__", "sha256:" + "0" * 64)
          text = text.replace("__TRAEFIK_ROUTER_RULE__", "Host(`example.invalid`)")
          text = text.replace("/mnt/nvme/90.service/blog_data/.env.api", "/dev/null")
          print(text)
          PY
          sed 's/__REGISTRY_BIND_IP__/192.0.2.10/' deploy/truenas/bae-registry.yml \
            | docker compose -f - config -q

      - name: Run tests when tests directory exists
        run: |
          if [ -d tests ]; then
            python -m pytest -q
          else
            echo "No tests directory. Skipping tests."
          fi

      # 머지 전에 운영과 같은 Dockerfile·digest 고정 베이스로 실제 빌드까지 확인한다.
      # 레지스트리에는 push하지 않고 검사 태그만 지워 레이어 캐시는 다음 빌드에 재사용한다.
      - name: Build application image
        run: |
          set -euo pipefail
          DEPLOY_HOST="${DEPLOY_SSH_TARGET##*@}"
          REGISTRY="$DEPLOY_HOST:5000"
          CI_IMAGE="bae-blog-ci:$GITHUB_SHA"

          curl -fsS --max-time 10 "http://$REGISTRY/v2/" >/dev/null
          docker build \
            --build-arg "BASE_IMAGE=$REGISTRY/fastapi-py312@$BASE_IMAGE_DIGEST" \
            --build-arg "APP_VERSION=ci" \
            --build-arg "VCS_REF=$GITHUB_SHA" \
            --tag "$CI_IMAGE" .
          docker run --rm --entrypoint sh "$CI_IMAGE" -c '
            test -s /app/public/vendor/chart.umd.min.js &&
            test -s /app/public/vendor/chartjs-chart-financial.min.js &&
            test -s /app/public/vendor/chartjs-plugin-zoom.min.js &&
            test -s /app/public/vendor/hammer.min.js &&
            test -s /app/public/vendor/quill/quill.min.js &&
            test -s /app/public/vendor/quill/quill.snow.css
          '

      - name: Remove CI image tag
        if: always()
        run: docker image rm --force "bae-blog-ci:$GITHUB_SHA" >/dev/null 2>&1 || true

  # 1단계: 릴리스 생성 (Release)
  create-release:
    needs: quality-check
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      VERSION: ${{ steps.get_version.outputs.VERSION }}
      RELEASE_CREATED: ${{ steps.release_decision.outputs.release_created }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # package.json에서 버전 추출
      - name: Extract version
        id: get_version
        run: |
          VERSION=$(jq -r .version package.json)
          echo "VERSION=v$VERSION" >> "$GITHUB_OUTPUT"

      # 같은 버전을 다시 쓰면 이전 릴리스 이력이 사라진다. 삭제 후 재생성하지 않고 실패시킨다.
      - name: Check version is new
        run: |
          TAG="${{ steps.get_version.outputs.VERSION }}"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::이미 존재하는 버전이다: $TAG"
            exit 1
          fi
      - name: Set release decision
        id: release_decision
        run: echo "release_created=true" >> "$GITHUB_OUTPUT"

      - name: Build release notes from commit history
        if: steps.release_decision.outputs.release_created == 'true'
        run: |
          set -e

          CURRENT_TAG="${{ steps.get_version.outputs.VERSION }}"
          PREV_TAG=$(git tag --sort=-v:refname | grep -v "^${CURRENT_TAG}$" | head -n 1 || true)

          {
            echo "## Full Commit List"
            if [ -n "$PREV_TAG" ]; then
              echo
              echo "Base: $PREV_TAG -> $CURRENT_TAG"
              echo
              git log "$PREV_TAG..HEAD" --pretty=format:'- %s (%h)'
            else
              echo
              echo "Base: initial release"
              echo
              git log --pretty=format:'- %s (%h)'
            fi
          } > RELEASE_NOTES.md

          if ! grep -q "^- " RELEASE_NOTES.md; then
            echo "- No commits found in this release window." >> RELEASE_NOTES.md
          fi

      # GitHub Release 생성
      - name: Create GitHub Release
        if: steps.release_decision.outputs.release_created == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          name: Release ${{ steps.get_version.outputs.VERSION }}
          body_path: RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 2단계: 서버 배포 (CD)
  deploy:
    needs: create-release
    if: github.ref == 'refs/heads/main' && needs.create-release.outputs.RELEASE_CREATED == 'true'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build and push application image
        run: |
          set -euo pipefail
          VERSION="${{ needs.create-release.outputs.VERSION }}"
          DEPLOY_HOST="${DEPLOY_SSH_TARGET##*@}"
          REGISTRY="$DEPLOY_HOST:5000"
          IMAGE="$REGISTRY/bae-blog:$VERSION"

          curl -fsS --max-time 10 "http://$REGISTRY/v2/" >/dev/null
          docker build \
            --build-arg "BASE_IMAGE=$REGISTRY/fastapi-py312@$BASE_IMAGE_DIGEST" \
            --build-arg "APP_VERSION=$VERSION" \
            --build-arg "VCS_REF=$GITHUB_SHA" \
            --tag "$IMAGE" .
          docker push "$IMAGE"
          DIGEST_REF=$(docker image inspect "$IMAGE" --format '{{index .RepoDigests 0}}')
          IMAGE_DIGEST="${DIGEST_REF##*@}"
          if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::이미지 digest를 확인할 수 없다: $DIGEST_REF"
            exit 1
          fi
          echo "IMAGE_DIGEST=$IMAGE_DIGEST" >> "$GITHUB_ENV"

      # 저장소의 YAML도 매번 보낸다. NAS의 강제 명령은 이미지·데이터 경로·라벨을
      # allowlist로 검사한 뒤 bae-blog 하나에만 적용한다.
      - name: Apply TrueNAS compose
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_blog -o BatchMode=yes -o ConnectTimeout=10 \
              "$DEPLOY_SSH_TARGET" \
              "deploy ${{ needs.create-release.outputs.VERSION }} $IMAGE_DIGEST" \
              < deploy/truenas/bae-blog.yml

      # 재시작이 성공해도 앱이 500 을 뿜을 수 있다. 실제 응답까지 확인해야 배포가
      # "됐다"고 말할 수 있다 — 초록불인데 사이트가 죽어 있는 상태를 막는다.
      - name: Verify site responds
        run: |
          set -u
          for i in $(seq 1 12); do
            code=$(curl -sL -o /dev/null -w '%{http_code}' --max-time 10 "$HEALTH_URL" || true)
            if [ "$code" = "200" ]; then
              echo "사이트 정상 ($code) — $HEALTH_URL"
              exit 0
            fi
            echo "  대기 중... ($i/12, 마지막 응답 ${code:-없음})"
            sleep 5
          done
          echo "::error::배포 후 사이트가 200 을 주지 않는다 (마지막 ${code:-없음})"
          exit 1

      - name: Deployment complete
        run: echo "Successfully deployed image ${{ needs.create-release.outputs.VERSION }}"
