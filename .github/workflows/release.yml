name: Main Branch CI/CD Pipeline

on:
  push:
    branches:
      - main # main 브랜치에 코드가 푸시(머지 포함)될 때 실행

concurrency:
  group: production-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_DIR: /mnt/10.project/20.blog
  DEPLOY_BRANCH: main
  # 러너(VM) → NAS. 여기로 SSH 하면 authorized_keys 의 `command=` 가 재시작 스크립트를
  # 강제 실행한다 — 무슨 명령을 보내든 그것만 돈다.
  DEPLOY_SSH_TARGET: bae4969@192.168.135.30
  # 배포가 끝나고 실제로 열어 볼 주소. `/` 는 `/blog` 로 302 하므로 -L 로 따라간다.
  HEALTH_URL: https://blog.bdda.duckdns.org/

jobs:
  # 0단계: 기본 검증 (CI)
  quality-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ⚠️ `requirements-api.txt` 에는 **공용 이미지에 없는 것만** 적혀 있다(지금은 nh3 하나).
      #    런타임 의존성은 `fastapi-py312` 이미지가 들고 있는데 CI 러너에는 그 이미지가
      #    없다. 그래서 아래 검사에 필요한 것을 여기서 따로 깐다 — 안 그러면
      #    템플릿 검사가 `ModuleNotFoundError: jinja2` 로 죽는다(2026-08-17 실제로 그랬다.
      #    이 검사는 PHP 시절 이후 main 푸시가 없어 한 번도 돌아본 적이 없었다).
      - name: Install dependencies for CI
        run: |
          pip install --no-cache-dir -r requirements-api.txt
          # ⚠️ 러너에는 공용 이미지(fastapi-py312)가 없다. 앱을 임포트하려면 런타임
          #    의존성을 여기서 다시 깔아야 한다 — 목록과 이유는 requirements-ci.txt 참조.
          pip install --no-cache-dir -r requirements-ci.txt

      # PHP 스택을 걷어냈다. 옛 `php -l` 자리 — 컴파일만 확인한다(실행하지 않는다).
      - name: Python 문법 검사
        run: python -m compileall -q app

      # 템플릿은 문법이 깨져도 임포트로는 안 드러난다. 실제로 관리자 화면 전부가
      # 500 이 된 적이 있어(리스트 리터럴 안의 Jinja 주석) 컴파일을 따로 확인한다.
      - name: Jinja 템플릿 검사
        run: |
          python - <<'PY'
          from jinja2 import Environment, FileSystemLoader
          from pathlib import Path
          env = Environment(loader=FileSystemLoader("app/templates"))
          bad = []
          for p in sorted(Path("app/templates").rglob("*.html")):
              name = str(p.relative_to("app/templates"))
              try:
                  env.get_template(name)
              except Exception as e:
                  bad.append(f"{name}: {type(e).__name__} {e}")
          print("\n".join(bad) if bad else "템플릿 OK")
          raise SystemExit(1 if bad else 0)
          PY

      - name: Run tests when tests directory exists
        run: |
          if [ -d tests ]; then
            python -m pytest -q
          else
            echo "No tests directory. Skipping tests."
          fi

  # 1단계: 릴리스 생성 (Release)
  create-release:
    needs: quality-check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      VERSION: ${{ steps.get_version.outputs.VERSION }}
      RELEASE_CREATED: ${{ steps.release_decision.outputs.release_created }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # package.json에서 버전 추출
      - name: Extract version
        id: get_version
        run: |
          VERSION=$(jq -r .version package.json)
          echo "VERSION=v$VERSION" >> $GITHUB_OUTPUT

      - name: Delete existing release and tag if exists
        run: |
          TAG="${{ steps.get_version.outputs.VERSION }}"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Existing release $TAG found. Deleting..."
            gh release delete "$TAG" --yes --cleanup-tag
            echo "Deleted existing release and tag $TAG"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set release decision
        id: release_decision
        run: echo "release_created=true" >> $GITHUB_OUTPUT

      # 배포용 파일 압축
      - name: Archive production files
        if: steps.release_decision.outputs.release_created == 'true'
        run: |
          zip -r release-source.zip . -x "node_modules/*" ".git/*" ".github/*" "vendor/*" "cache/data/*"

      - name: Upload release artifact
        if: steps.release_decision.outputs.release_created == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-source
          path: release-source.zip

      - name: Build release notes from commit history
        if: steps.release_decision.outputs.release_created == 'true'
        run: |
          set -e

          CURRENT_TAG="${{ steps.get_version.outputs.VERSION }}"
          PREV_TAG=$(git tag --sort=-v:refname | grep -v "^${CURRENT_TAG}$" | head -n 1 || true)

          {
            echo "## Full Commit List"
            if [ -n "$PREV_TAG" ]; then
              echo
              echo "Base: $PREV_TAG -> $CURRENT_TAG"
              echo
              git log "$PREV_TAG..HEAD" --pretty=format:'- %s (%h)'
            else
              echo
              echo "Base: initial release"
              echo
              git log --pretty=format:'- %s (%h)'
            fi
          } > RELEASE_NOTES.md

          if ! grep -q "^- " RELEASE_NOTES.md; then
            echo "- No commits found in this release window." >> RELEASE_NOTES.md
          fi

      # GitHub Release 생성
      - name: Create GitHub Release
        if: steps.release_decision.outputs.release_created == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          name: Release ${{ steps.get_version.outputs.VERSION }}
          files: release-source.zip
          body_path: RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 2단계: 서버 배포 (CD)
  deploy:
    needs: create-release
    if: needs.create-release.outputs.RELEASE_CREATED == 'true'
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Sync source in VM directory
        run: |
          set -e

          if [ ! -d "$APP_DIR/.git" ]; then
            echo "Repository not found in $APP_DIR"
            exit 1
          fi

          # 배포에서 권한 변경은 하지 않고, 권한 문제 시 명확히 실패 처리
          if [ ! -r "$APP_DIR/.git/objects" ] || [ ! -w "$APP_DIR/.git/objects" ]; then
            echo "Permission denied for $APP_DIR/.git/objects"
            echo "Fix repository ownership/permissions manually on runner host, then retry."
            exit 1
          fi

          cd "$APP_DIR"
          git fetch origin "$DEPLOY_BRANCH"
          git checkout "$DEPLOY_BRANCH"
          git reset --hard "origin/$DEPLOY_BRANCH"

      # 업로드 폴더는 gitignore 라 배포로 안 따라온다 — 없으면 이미지 업로드가 깨진다.
      # ⚠️ 경로는 `public/uploads/images` 다. 예전엔 PHP 기준으로 루트의 `cache/data`·
      #    `uploads/images` 를 만들었는데, 파이썬 앱은 둘 다 쓰지 않아 빈 폴더만 쌓였다.
      - name: Ensure writable directories
        run: |
          set -e
          cd "$APP_DIR"
          mkdir -p public/uploads/images

      # 파일만 바꿔서는 반영되지 않는다 — uvicorn 은 **떠 있는 프로세스**라 옛 코드가
      # 계속 돈다. PHP 시절에는 인터프리터 + 바인드 마운트라 이 단계가 필요 없었다.
      #
      # 러너 VM 에는 docker 가 없어서(NFS 로 소스만 붙어 있다) NAS 로 SSH 해 재시작한다.
      # 그 키는 authorized_keys 의 `command=` 로 재시작 스크립트에 묶여 있어, 러너가
      # 털려도 이 컨테이너를 재시작하는 것 말고는 할 수 있는 게 없다.
      - name: Restart app container
        run: |
          set -uo pipefail
          ssh -i ~/.ssh/deploy_blog -o BatchMode=yes -o ConnectTimeout=10 \
              "$DEPLOY_SSH_TARGET" restart
          rc=$?
          if [ "$rc" -ne 0 ]; then
            # 종료코드 10 은 "컨테이너가 없다" 는 뜻이다. 전환 기간에는 넘어갔지만
            # 이제는 항상 있어야 하므로 그것도 실패로 본다.
            echo "::error::앱 재시작 실패 (exit $rc)"
            exit "$rc"
          fi

      # 재시작이 성공해도 앱이 500 을 뿜을 수 있다. 실제 응답까지 확인해야 배포가
      # "됐다"고 말할 수 있다 — 초록불인데 사이트가 죽어 있는 상태를 막는다.
      - name: Verify site responds
        run: |
          set -u
          for i in $(seq 1 12); do
            code=$(curl -sL -o /dev/null -w '%{http_code}' --max-time 10 "$HEALTH_URL" || true)
            if [ "$code" = "200" ]; then
              echo "사이트 정상 ($code) — $HEALTH_URL"
              exit 0
            fi
            echo "  대기 중... ($i/12, 마지막 응답 ${code:-없음})"
            sleep 5
          done
          echo "::error::배포 후 사이트가 200 을 주지 않는다 (마지막 ${code:-없음})"
          exit 1

      - name: Deployment complete
        run: echo "Successfully deployed ${{ needs.create-release.outputs.VERSION }} to $APP_DIR"
